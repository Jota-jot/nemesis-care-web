name: Némesis core and RADAR tests

on:
  push:
    branches: [main, "feat/nemesis-mvp-core"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile engine and tests
        run: python -m compileall -q engine tests
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
